name: El Cencerro de la Sede

on:
  schedule:
    - cron: '0 8 * * 1'   # lunes a las 9:00 en Madrid (horario de invierno)
  workflow_dispatch:
    inputs:
      diagnostico:
        description: 'Volcar en el log cómo vienen los datos reales (1 = sí, 0 = no)'
        default: '1'

permissions:
  contents: write

concurrency:
  group: cencerro
  cancel-in-progress: false

jobs:
  periodico:
    runs-on: ubuntu-latest
    steps:
      - name: Repo del periódico
        uses: actions/checkout@v4

      - name: Colocar archivos en su carpeta (por si se subieron sueltos a la raíz)
        run: |
          mkdir -p scripts datos fotos
          for f in construir-edicion.js renderizar.js cerrar-edicion.js; do
            if [ -f "$f" ]; then cp -f "$f" "scripts/$f"; fi
          done
          for f in calendarios.json cronicas.json noticias.json; do
            if [ -f "$f" ] && [ ! -f "datos/$f" ]; then cp "$f" "datos/$f"; fi
          done
          [ -f estado.json ] || echo '{}' > estado.json
          echo "Contenido del repo:"; ls -R scripts datos | head -40

      - name: Traer Actas-Villa (resultados, es público)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Actas-Villa
          path: fuentes/actas

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Escudo y mascota del club
        run: |
          f=$(find fuentes/actas -name 'escudo-club.png' | head -1); [ -n "$f" ] && cp "$f" escudo-club.png || true
          f=$(find fuentes/actas -iname '*victoria*local*.png' | head -1); [ -n "$f" ] && cp "$f" mascota-victoria-local.png || true

      - name: Construir la edición
        id: construir
        env:
          DIAGNOSTICO: ${{ github.event.inputs.diagnostico || '0' }}
        run: node scripts/construir-edicion.js

      - name: Maquetar las páginas
        if: steps.construir.outputs.hay_edicion == 'true'
        run: node scripts/renderizar.js

      - name: Cerrar la edición (ultimo/, estado y archivo)
        if: steps.construir.outputs.hay_edicion == 'true'
        run: node scripts/cerrar-edicion.js

      - name: Guardar en el repo
        if: steps.construir.outputs.hay_edicion == 'true'
        run: |
          git config user.name "El Cencerro"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A estado.json datos fotos archivo ultimo
          git diff --cached --quiet && exit 0
          git commit -m "Cencerro Nº $(node -p "require('./estado.json').numero")"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then echo "✅ Guardado"; exit 0; fi
            sleep 5
          done
          echo "❌ No se pudo guardar en el repo"; exit 1